{% extends 'base.html' %}

{% block title %}Carrito - IAGAMA{% endblock %}

{% block content %}
<div class="min-h-screen px-4 md:px-10 pt-4">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-2xl md:text-3xl lg:text-5xl font-extrabold mt-6 md:mt-8 text-center">
            Finalizar <span class="neon-blue">Pedido</span>
        </h1>
        <p class="text-sm md:text-base lg:text-xl text-gray-300 mb-8 md:mb-12 text-center">
            Revisa tu pedido y completa tus datos de contacto
        </p>

        <div class="grid md:grid-cols-2 gap-4 md:gap-8">
            <!-- Formulario de Datos del Cliente -->
            <div class="bg-gray-900 rounded-lg border border-gray-700 p-4 md:p-6">
                <h2 class="text-lg md:text-xl font-bold text-white mb-4 md:mb-6">Datos de Contacto</h2>
                <form id="checkoutForm">
                    <div class="mb-3 md:mb-4">
                        <label for="nombre_cliente" class="block text-xs md:text-sm font-medium text-gray-300 mb-1 md:mb-2">
                            Nombre Completo <span class="text-red-500">*</span>
                        </label>
                        <input type="text" id="nombre_cliente" name="nombre_cliente" required
                            class="w-full px-3 md:px-4 py-2 border border-gray-700 rounded-lg bg-gray-800 text-white focus:border-blue-500 focus:outline-none text-sm md:text-base"
                            placeholder="Tu nombre completo">
                    </div>

                    <div class="mb-3 md:mb-4">
                        <label for="telefono_cliente" class="block text-xs md:text-sm font-medium text-gray-300 mb-1 md:mb-2">
                            Teléfono / WhatsApp <span class="text-red-500">*</span>
                        </label>
                        <input type="tel" id="telefono_cliente" name="telefono_cliente" required
                            class="w-full px-3 md:px-4 py-2 border border-gray-700 rounded-lg bg-gray-800 text-white focus:border-blue-500 focus:outline-none text-sm md:text-base"
                            placeholder="Tu número de teléfono">
                    </div>

                    <div class="mb-3 md:mb-4">
                        <label for="notas" class="block text-xs md:text-sm font-medium text-gray-300 mb-1 md:mb-2">
                            Notas Adicionales
                        </label>
                        <textarea id="notas" name="notas" rows="3"
                            class="w-full px-3 md:px-4 py-2 border border-gray-700 rounded-lg bg-gray-800 text-white focus:border-blue-500 focus:outline-none text-sm md:text-base resize-none"
                            placeholder="Algún comentario adicional sobre tu pedido..."></textarea>
                    </div>
                </form>
            </div>

            <!-- Resumen del Pedido -->
            <div class="bg-gray-900 rounded-lg border border-gray-700 p-4 md:p-6">
                <h2 class="text-lg md:text-xl font-bold text-white mb-4 md:mb-6">Resumen del Pedido</h2>
                <div id="carritoItems" class="space-y-3 md:space-y-4 mb-4 md:mb-6">
                    <!-- Los items del carrito se cargarán aquí -->
                </div>

                <div class="border-t border-gray-700 pt-3 md:pt-4">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-gray-300 text-sm md:text-base">Subtotal</span>
                        <span id="subtotal" class="text-white font-semibold text-sm md:text-base">$0</span>
                    </div>
                    <div class="flex justify-between items-center mb-3 md:mb-4">
                        <span class="text-gray-300 text-sm md:text-base">Total</span>
                        <span id="total" class="text-xl md:text-2xl font-bold text-blue-400">$0</span>
                    </div>

                    <button onclick="enviarPedido()"
                        class="w-full btn-neon-special text-white py-2 md:py-3 px-4 md:px-6 rounded-lg font-semibold flex items-center justify-center gap-2 text-sm md:text-base">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-whatsapp" viewBox="0 0 16 16">
                            <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
                        </svg>
                        <span class="hidden md:inline">Enviar Pedido por WhatsApp</span>
                        <span class="md:hidden">Enviar por WhatsApp</span>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/carrito.js') }}"></script>
<script>
    // Número de WhatsApp de la tienda
    const WHATSAPP_NUMBER = '573213908110'; 

    // Cargar items del carrito al iniciar
    document.addEventListener('DOMContentLoaded', function() {
        cargarCarrito();
    });

    function cargarCarrito() {
        const carrito = obtenerCarrito();
        const carritoItems = document.getElementById('carritoItems');

        if (carrito.length === 0) {
            carritoItems.innerHTML = '<p class="text-gray-400 text-center py-4">El carrito está vacío</p>';
            document.getElementById('subtotal').textContent = '$0';
            document.getElementById('total').textContent = '$0';
            return;
        }

        let html = '';
        let total = 0;

        carrito.forEach(item => {
            const subtotal = item.precio * item.cantidad;
            total += subtotal;

            html += `
                <div class="flex items-center gap-2 md:gap-4 p-2 md:p-3 bg-gray-800 rounded-lg">
                    <div class="w-12 h-12 md:w-16 md:h-16 bg-gray-700 rounded overflow-hidden flex-shrink-0">
                        <img src="{{ url_for('static', filename='productos/') }}${item.imagen_principal}"
                             alt="${item.nombre}"
                             class="w-full h-full object-cover">
                    </div>
                    <div class="flex-1 min-w-0">
                        <h3 class="text-white font-medium text-xs md:text-sm truncate">${item.nombre}</h3>
                        <p class="text-blue-400 font-semibold text-xs md:text-sm">$${Number(item.precio).toLocaleString('es-CO')}</p>
                    </div>
                    <div class="flex items-center gap-1 md:gap-2">
                        <button onclick="cambiarCantidad(${item.id}, ${item.cantidad - 1})"
                                class="w-6 h-6 md:w-8 md:h-8 bg-gray-700 hover:bg-gray-600 text-white rounded flex items-center justify-center text-xs md:text-base"
                                ${item.cantidad <= 1 ? 'disabled' : ''}>
                            -
                        </button>
                        <span class="text-white font-medium w-6 md:w-8 text-center text-xs md:text-sm">${item.cantidad}</span>
                        <button onclick="cambiarCantidad(${item.id}, ${item.cantidad + 1})"
                                class="w-6 h-6 md:w-8 md:h-8 bg-gray-700 hover:bg-gray-600 text-white rounded flex items-center justify-center text-xs md:text-base">
                            +
                        </button>
                    </div>
                    <div class="text-right flex-shrink-0">
                        <p class="text-white font-bold text-xs md:text-sm">$${Number(subtotal).toLocaleString('es-CO')}</p>
                        <button onclick="eliminarItem(${item.id})"
                                class="text-red-400 hover:text-red-300 text-xs mt-1">
                            Eliminar
                        </button>
                    </div>
                </div>
            `;
        });

        carritoItems.innerHTML = html;
        document.getElementById('subtotal').textContent = '$' + Number(total).toLocaleString('es-CO');
        document.getElementById('total').textContent = '$' + Number(total).toLocaleString('es-CO');
    }

    function cambiarCantidad(productoId, nuevaCantidad) {
        actualizarCantidad(productoId, nuevaCantidad);
        cargarCarrito();
    }

    function eliminarItem(productoId) {
        if (confirm('¿Estás seguro de eliminar este producto del carrito?')) {
            eliminarDelCarrito(productoId);
            cargarCarrito();
        }
    }

    async function enviarPedido() {
        const nombreCliente = document.getElementById('nombre_cliente').value.trim();
        const telefonoCliente = document.getElementById('telefono_cliente').value.trim();
        const notas = document.getElementById('notas').value.trim();
        const carrito = obtenerCarrito();

        // Validar formulario
        if (!nombreCliente) {
            alert('Por favor, ingresa tu nombre completo');
            return;
        }
        if (!telefonoCliente) {
            alert('Por favor, ingresa tu número de teléfono');
            return;
        }
        if (carrito.length === 0) {
            alert('El carrito está vacío');
            return;
        }

        try {
            // Guardar pedido en BD (estado borrador)
            const response = await fetch('/pedidos/crear', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    nombre_cliente: nombreCliente,
                    telefono_cliente: telefonoCliente,
                    notas: notas,
                    items: carrito
                })
            });

            const data = await response.json();

            if (!data.success) {
                alert('Error: ' + data.message);
                return;
            }

            // Generar mensaje de WhatsApp
            const mensaje = generarMensajeWhatsApp(nombreCliente, telefonoCliente, notas, carrito, data.pedido_id);

            // Actualizar estado a pendiente antes de abrir WhatsApp
            await fetch(`/pedidos/${data.pedido_id}/whatsapp`, {
                method: 'PUT'
            });

            // Abrir WhatsApp
            const whatsappUrl = `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(mensaje)}`;
            window.open(whatsappUrl, '_blank');

            // Limpiar carrito y redirigir
            limpiarCarrito();
            alert('Pedido enviado exitosamente. Te redirigiremos a la tienda.');
            window.location.href = '/tienda';

        } catch (error) {
            console.error('Error al enviar pedido:', error);
            alert('Error al enviar el pedido. Por favor, intenta nuevamente.');
        }
    }

    function generarMensajeWhatsApp(nombre, telefono, notas, carrito, pedidoId) {
        let mensaje = `🛒 *NUEVO PEDIDO *\n\n`;
        mensaje += `👤 *Cliente:* ${nombre}\n`;
        mensaje += `📱 *Teléfono:* ${telefono}\n\n`;
        mensaje += `📦 *Productos:*\n`;

        let total = 0;
        carrito.forEach((item, index) => {
            const subtotal = item.precio * item.cantidad;
            total += subtotal;
            mensaje += `${index + 1}. ${item.nombre}\n`;
            mensaje += `   Cantidad: ${item.cantidad}\n`;
            mensaje += `   Precio unitario: $${Number(item.precio).toLocaleString('es-CO')}\n`;
            mensaje += `   Subtotal: $${Number(subtotal).toLocaleString('es-CO')}\n\n`;
        });

        mensaje += `💰 *TOTAL: $${Number(total).toLocaleString('es-CO')}*\n`;

        if (notas) {
            mensaje += `\n📝 *Notas:* ${notas}\n`;
        }

        mensaje += `\n✅ Pedido enviado desde IAGAMA`;

        return mensaje;
    }
</script>
{% endblock %}
