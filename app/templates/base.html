<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{% block title %}IAGAMA – {{ block.super }}{% endblock %}</title>
    <meta name="description"
content="Especialistas en reparación y mantenimiento de computadores, cambio de pantallas para celulares y venta de accesorios tecnológicos en Saravena, Arauca. Diagnóstico profesional y garantía.">
<meta name="keywords"
content="reparación de computadores, mantenimiento de computadores, reparación de portátiles, cambio de pantalla celular, accesorios tecnológicos, tienda de tecnología, Saravena, Arauca, servicio técnico computadores, IAGama">
<meta name="robots" content="index,follow">
<meta name="author" content="IAGama">
<meta http-equiv="content-language" content="es-co">
<link rel="canonical" href="https://www.iagama.com/">
<link rel="icon" href="{{ url_for('static', filename='img/favicon.ico') }}" type="image/x-icon">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ComputerStore",
  "name": "IAGama",
  "url": "https://www.iagama.com",
  "logo": "https://www.iagama.com/static/img/logo.webp",
  "image": "https://www.iagama.com/static/img/og-image.webp",
  "description": "Reparación y mantenimiento de computadores, cambio de pantallas para celulares y venta de accesorios tecnológicos en Saravena, Arauca.",

  "telephone": "+57 3213908110",

  "address": {
    "@type": "PostalAddress",
    "streetAddress": "calle 25 # 15 - 89",
    "addressLocality": "Saravena",
    "addressRegion": "Arauca",
    "postalCode": "815010",
    "addressCountry": "CO"
  },

  "geo": {
    "@type": "GeoCoordinates",
    "latitude": "6.954579013824563",
    "longitude": "-71.87573511060396"
  },

  "openingHoursSpecification": [
    {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": [
        "Monday",
        "Tuesday",
        "Wednesday",
        "Thursday",
        "Friday"
      ],
      "opens": "08:00",
      "closes": "18:00"
    },
    {
      "@type": "OpeningHoursSpecification",
      "dayOfWeek": "Saturday",
      "opens": "08:00",
      "closes": "13:00"
    }
  ],

  "sameAs": [
    "https://www.facebook.com/profile.php?id=61559563177193",
    "https://www.instagram.com/TU-USUARIO"
  ],

  "areaServed": {
    "@type": "City",
    "name": "Saravena"
  },

  "priceRange": "$$",

  "hasOfferCatalog": {
    "@type": "OfferCatalog",
    "name": "Servicios y productos IAGama",
    "itemListElement": [
      {
        "@type": "Offer",
        "itemOffered": {
          "@type": "Service",
          "name": "Reparación de computadores"
        }
      },
      {
        "@type": "Offer",
        "itemOffered": {
          "@type": "Service",
          "name": "Mantenimiento de computadores"
        }
      },
      {
        "@type": "Offer",
        "itemOffered": {
          "@type": "Service",
          "name": "Cambio de pantalla para celulares"
        }
      },
      {
        "@type": "Offer",
        "itemOffered": {
          "@type": "Product",
          "name": "Accesorios tecnológicos"
        }
      }
    ]
  }
}
</script>

    <!-- TAILWIND CSS -->
    <link href="{{ url_for('static', filename='css/output.css') }}" rel="stylesheet">

    <!-- LIGHT MODE CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/light-mode.css') }}">

    <!-- CUSTOM CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">

    <style>
        /* Efecto neón */
        .neon-blue {
            color: #001aff;
            text-shadow: 0 0 18px #151516, 0 8 16px #0059ff;
        }

        .btn-neon {
            background: #001aff;
            box-shadow: 0 0 8px #001aff, 0 0 16px #0a4cdb;
        }

        .btn-neon:hover {
            background: #0012b8;
            box-shadow: 0 0 12px #d2d2d4, 0 0 24px #d9dadd;
        }
    </style>

    {% block extra_css %}
    {% if request.endpoint=='main.tienda' %}
    <style>
        .nav-layout-responsive {
            padding-top: 0.5rem !important;
            padding-bottom: 0.5rem !important;
        }

        .nav-layout-responsive .logo-spacing img {
            height: 2.5rem !important;
        }

        .nav-layout-responsive .nav-menu-responsive {
            font-size: 0.875rem !important;
        }

        .mobile-menu-btn {
            font-size: 1.5rem !important;
        }
    </style>
    {% endif %}

    <!-- Estilos para tema claro en mobileMenu -->
    <style>
        /* Mobile menu en tema claro */
        body.light-mode #mobileMenu {
            background-color: white !important;
            border-color: #e5e7eb !important;
            color: #1f2937 !important;
        }

        body.light-mode #mobileMenu .border-t {
            border-color: #e5e7eb !important;
        }

        body.light-mode #mobileMenu span {
            color: #1f2937 !important;
        }

        body.light-mode #mobileMenu span:hover {
            color: #3b82f6 !important;
        }

        body.light-mode #mobileMenu button {
            color: #3b82f6 !important;
        }

        body.light-mode #mobileMenu button:hover {
            color: #2563eb !important;
        }
    </style>
    {% endblock %}
</head>

<body class="bg-black text-white font-sans">
    <!-- Header -->
    {% include 'partials/header.html' %}

    <!-- Contenido Principal -->
    {% block content %}{% endblock %}

    <!-- Footer -->
    {% include 'partials/footer.html' %}

    <!-- THEME TOGGLE JS -->
    <script src="{{ url_for('static', filename='js/theme-toggle.js') }}"></script>

    <!-- MAIN JS -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    <!-- CARRITO JS -->
    <script src="{{ url_for('static', filename='js/carrito.js') }}"></script>

    {% block extra_js %}{% endblock %}
</body>

</html>
